[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [".venv", "*/migrations/*"]

[tool.ruff.lint]
# pyflakes, pycodestyle errors/warnings, bugbear, isort, pyupgrade, Django-specific
select = ["F", "E", "W", "B", "I", "UP", "DJ"]
ignore = [
  "E741",   # short loop names like `l` are used for "line" throughout the domain code
  "DJ001",  # nullable CharFields are not used; rule is noisy with blank=True
  "B904",   # DRF error translation re-raises intentionally without chaining
  "DJ008",  # small value models (lines, events, sequences) do not need __str__
]

[tool.ruff.lint.isort]
known-first-party = ["accounts", "core", "config"]

[tool.ruff.lint.per-file-ignores]
"core/management/commands/seed.py" = ["E501"]  # demo data tables read better on one line
